plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    id 'maven-publish'
}

android {
    namespace = 'com.ozcanalasalvar.library'
    compileSdk = libs.versions.androidCompileSdk.get().toInteger()

    defaultConfig {
        minSdk = 26
        targetSdk = libs.versions.androidTargetSdk.get().toInteger()

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose = true
    }

}

publishing {
    publications {
        release(MavenPublication) {
            groupId = 'com.ozcanalasalvar'
            artifactId = 'datepicker'
            version = '2.0.7'
            artifact(layout.buildDirectory.file('outputs/aar/datepicker-release.aar'))
        }
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation platform(libs.compose.bom)
    implementation libs.compose.ui.core
    implementation libs.compose.material3
    implementation libs.compose.ui.tooling.preview

    implementation(libs.activity.compose)

    testImplementation libs.junit
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.espresso.core
    implementation libs.material

    api project(path: ':wheelview')
}
