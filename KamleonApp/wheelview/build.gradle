plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    id 'maven-publish'
}

android {
    namespace = 'com.ozcanalasalvar.wheelview'
    compileSdk = libs.versions.androidCompileSdk.get().toInteger()

    defaultConfig {
        minSdk = 21

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose = true
    }

}

publishing {
    publications {
        release(MavenPublication) {
            groupId = 'com.ozcanalasalvar'
            artifactId = 'wheelview'
            version = '1.0.0-alpha08'
            artifact(layout.buildDirectory.file('outputs/aar/wheelview-release.aar'))
        }
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation platform(libs.compose.bom)
    implementation libs.compose.ui.core
    implementation libs.compose.material3
    implementation libs.compose.ui.tooling.preview


    testImplementation libs.junit
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.espresso.core
    implementation libs.material
}
