plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id("kotlin-kapt")
    id("com.google.dagger.hilt.android")
    id("com.google.gms.google-services")
}

android {
    namespace 'com.dynatech2012.kamleonuserapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.dynatech2012.kamleonuserapp"
        minSdk 26
        targetSdk 34
        versionCode 2015
        versionName "1.0.11"

        resValue "string", "app_version", "${versionName}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }
    buildFeatures {
        viewBinding true
        compose true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    flavorDimensions += "environment"
    productFlavors {
        development {
            dimension "environment"
            resValue "string", "app_name", "Kamleon-DEV"
            versionNameSuffix "-dev"
            resValue "string", "app_version", "${defaultConfig.versionName}${versionNameSuffix}"
        }
        prod {
            dimension "environment"
            resValue "string", "app_name", "Kamleon"
            resValue "string", "app_version", "${defaultConfig.versionName}"
        }
        stagging {
            dimension "environment"
            resValue "string", "app_name", "Kamleon-PRE"
            versionNameSuffix "-pre"
            resValue "string", "app_version", "${defaultConfig.versionName}${versionNameSuffix}"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.7'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // Compose
    implementation 'androidx.compose.material3:material3:1.3.0'
    implementation "com.google.accompanist:accompanist-systemuicontroller:0.27.0"

    implementation "com.google.dagger:hilt-android:2.52"
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation platform('androidx.compose:compose-bom:2024.10.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation "androidx.compose.ui:ui-android:1.7.4"
    implementation 'com.google.firebase:firebase-messaging-ktx:24.0.3'

    androidTestImplementation platform('androidx.compose:compose-bom:2024.10.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    kapt "com.google.dagger:hilt-compiler:2.52"
    implementation "androidx.hilt:hilt-navigation-compose:1.2.0"
    implementation "androidx.compose.runtime:runtime-livedata:1.7.4"

    implementation project(path: ':datepicker')
    implementation project(path: ':wheelview')

    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.fragment:fragment-ktx:1.8.4'

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    // Firebase
    implementation(platform("com.google.firebase:firebase-bom:33.5.1"))
    implementation("com.google.firebase:firebase-analytics-ktx")
    implementation("com.google.firebase:firebase-auth-ktx")
    implementation("com.google.firebase:firebase-firestore-ktx")
    implementation("com.google.firebase:firebase-storage-ktx")
    implementation("com.google.firebase:firebase-database-ktx")
    implementation("com.google.firebase:firebase-functions-ktx")
    implementation 'com.google.firebase:firebase-analytics-ktx'

    // Navigation
    implementation("androidx.navigation:navigation-fragment-ktx:2.8.3")
    implementation("androidx.navigation:navigation-ui-ktx:2.8.3")

    // Images
    implementation 'io.coil-kt:coil:2.5.0'
    implementation 'io.coil-kt:coil-gif:2.5.0'
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    // Location
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Material
    implementation 'com.google.android.material:material:1.12.0'

    // Room
    implementation("androidx.room:room-runtime:2.6.1")
    kapt("androidx.room:room-compiler:2.6.1")
    implementation("androidx.room:room-ktx:2.6.1")
    //implementation "com.google.dagger:hilt-android:$hilt_version"
    //kapt "com.google.dagger:hilt-compiler:$hilt_version"

    // Gson
    implementation 'com.google.code.gson:gson:2.10.1'

    // Camera
    // The following line is optional, as the core library is included indirectly by camera-camera2
    implementation("androidx.camera:camera-core:1.3.4")
    implementation("androidx.camera:camera-camera2:1.3.4")
    // If you want to additionally use the CameraX Lifecycle library
    implementation("androidx.camera:camera-lifecycle:1.3.4")
    // If you want to additionally use the CameraX VideoCapture library
    implementation("androidx.camera:camera-video:1.3.4")
    // If you want to additionally use the CameraX View class
    implementation("androidx.camera:camera-view:1.3.4")
    // If you want to additionally add CameraX ML Kit Vision Integration
    //implementation("androidx.camera:camera-mlkit-vision:${camerax_version}")
    // If you want to additionally use the CameraX Extensions library
    implementation("androidx.camera:camera-extensions:1.3.4")
    implementation 'com.google.mlkit:vision-common:17.3.0'

    implementation 'com.google.zxing:core:3.5.0'
    //implementation "com.journeyapps:zxing-android-embedded:4.3.0"

    //implementation 'com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.0'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    // Splash
    implementation 'androidx.core:core-splashscreen:1.1.0-rc01'
}