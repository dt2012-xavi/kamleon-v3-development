import java.util.Properties

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id("kotlin-kapt")
    id("com.google.dagger.hilt.android")
    id("com.google.gms.google-services")
    id("com.google.firebase.crashlytics")
}

def localSigningFile = rootProject.file('signing.properties')
def localSigning = new Properties()
if (localSigningFile.isFile()) {
    localSigningFile.withInputStream { localSigning.load(it) }
    def missingSigningKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].findAll {
        !localSigning.getProperty(it)?.trim()
    }
    if (!missingSigningKeys.isEmpty()) {
        throw new GradleException("Missing signing.properties fields: ${missingSigningKeys.join(', ')}")
    }
}

android {
    namespace = 'com.dynatech2012.kamleonuserapp'
    compileSdk = 36

    defaultConfig {
        applicationId = "com.dynatech2012.kamleonuserapp"
        minSdk = 30
        targetSdk = 36
        versionCode = 2028
        versionName = "1.0.15"

        resValue "string", "app_version", "${versionName}"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }
    }
    buildFeatures {
        viewBinding = true
        compose = true
        buildConfig = true
    }
    signingConfigs {
        if (localSigningFile.isFile()) {
            upload {
                storeFile = file(localSigning.getProperty('storeFile'))
                storePassword = localSigning.getProperty('storePassword')
                keyAlias = localSigning.getProperty('keyAlias')
                keyPassword = localSigning.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    flavorDimensions += "environment"
    productFlavors {
        internal{
            dimension = "environment"
            resValue "string", "app_name", "Kamleon-INT"
            versionNameSuffix = "-int"
            resValue "string", "app_version", "${defaultConfig.versionName}${versionNameSuffix}"
            def appLinkHost = "kamleon-v3-internal.vercel.app"
            manifestPlaceholders = [appLinkHost: appLinkHost]
        }
        development {
            dimension = "environment"
            resValue "string", "app_name", "Kamleon-DEV"
            versionNameSuffix = "-dev"
            resValue "string", "app_version", "${defaultConfig.versionName}${versionNameSuffix}"
            def appLinkHost = "dev.kamleon.app"
            manifestPlaceholders = [appLinkHost: appLinkHost]
        }
        prod {
            dimension = "environment"
            if (localSigningFile.isFile()) {
                signingConfig = signingConfigs.upload
            }
            resValue "string", "app_name", "Kamleon"
            resValue "string", "app_version", "${defaultConfig.versionName}"
            def appLinkHost = "kamleon.app"
            manifestPlaceholders = [appLinkHost: appLinkHost]
        }
        preProduction {
            dimension = "environment"
            resValue "string", "app_name", "Kamleon-PRE"
            versionNameSuffix = "-pre"
            resValue "string", "app_version", "${defaultConfig.versionName}${versionNameSuffix}"
            def appLinkHost = "pre.kamleon.app"
            manifestPlaceholders = [appLinkHost: appLinkHost]
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

def validateProdReleaseSigning = tasks.register('validateProdReleaseSigning') {
    doLast {
        if (!localSigningFile.isFile()) {
            throw new GradleException('Create local signing.properties before building prodRelease. See docs/runbooks/android-release.md.')
        }
    }
}

tasks.matching { it.name in ['assembleProdRelease', 'bundleProdRelease'] }.configureEach {
    dependsOn validateProdReleaseSigning
}

dependencies {
    // Compose
    implementation libs.compose.material3
    implementation libs.accompanist.systemuicontroller

    implementation libs.hilt.android
    implementation libs.lifecycle.runtime.ktx
    implementation libs.activity.compose
    implementation platform(libs.compose.bom)
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'com.google.firebase:firebase-messaging'

    androidTestImplementation platform(libs.compose.bom)
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    kapt libs.hilt.compiler
    implementation libs.hilt.navigation.compose
    implementation 'androidx.compose.runtime:runtime-livedata'

    implementation project(path: ':datepicker')
    implementation project(path: ':wheelview')

    implementation libs.activity.ktx
    implementation libs.fragment.ktx

    implementation libs.core.ktx
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.espresso.core

    // Firebase
    implementation platform(libs.firebase.bom)
    implementation("com.google.firebase:firebase-analytics")
    implementation("com.google.firebase:firebase-auth")
    implementation("com.google.firebase:firebase-firestore")
    implementation("com.google.firebase:firebase-storage")
    implementation("com.google.firebase:firebase-database")
    implementation("com.google.firebase:firebase-functions")
    implementation("com.google.firebase:firebase-crashlytics")

    // Navigation
    implementation(libs.navigation.fragment.ktx)
    implementation(libs.navigation.ui.ktx)

    // Images
    implementation libs.coil
    implementation libs.coil.gif
    implementation libs.circleimageview

    // Location
    implementation libs.play.services.location

    // Room
    implementation libs.room.runtime
    kapt libs.room.compiler
    implementation libs.room.ktx

    // Gson
    implementation libs.gson

    // Camera
    implementation libs.camera.core
    implementation libs.camera.camera2
    implementation libs.camera.lifecycle
    implementation libs.camera.video
    implementation libs.camera.view
    implementation libs.camera.extensions
    implementation libs.mlkit.vision.common

    implementation libs.zxing.core
    //implementation "com.journeyapps:zxing-android-embedded:4.3.0"

    //implementation 'com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.0'
    implementation libs.mlkit.barcode.scanning

    // Splash
    implementation libs.core.splashscreen
}
