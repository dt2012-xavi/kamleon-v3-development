plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id("kotlin-kapt")
    id("com.google.dagger.hilt.android")
    id("com.google.gms.google-services")
}

android {
    namespace 'com.dynatech2012.kamleonuserapp'
    compileSdkVersion 36

    defaultConfig {
        applicationId "com.dynatech2012.kamleonuserapp"
        minSdk 26
        targetSdk 36
        versionCode 2022
        versionName "1.0.14"

        resValue "string", "app_version", "${versionName}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }
    buildFeatures {
        viewBinding true
        compose true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    flavorDimensions += "environment"
    productFlavors {
        internal{
            dimension "environment"
            resValue "string", "app_name", "Kamleon-INT"
            versionNameSuffix "-int"
            resValue "string", "app_version", "${defaultConfig.versionName}${versionNameSuffix}"
            def appLinkHost = "kamleon-v3-internal.vercel.app"
            manifestPlaceholders = [appLinkHost: appLinkHost]
        }
        development {
            dimension "environment"
            resValue "string", "app_name", "Kamleon-DEV"
            versionNameSuffix "-dev"
            resValue "string", "app_version", "${defaultConfig.versionName}${versionNameSuffix}"
            def appLinkHost = "dev.kamleon.app"
            manifestPlaceholders = [appLinkHost: appLinkHost]
        }
        prod {
            dimension "environment"
            resValue "string", "app_name", "Kamleon"
            resValue "string", "app_version", "${defaultConfig.versionName}"
            def appLinkHost = "kamleon.app"
            manifestPlaceholders = [appLinkHost: appLinkHost]
        }
        stagging {
            dimension "environment"
            resValue "string", "app_name", "Kamleon-PRE"
            versionNameSuffix "-pre"
            resValue "string", "app_version", "${defaultConfig.versionName}${versionNameSuffix}"
            def appLinkHost = "pre.kamleon.app"
            manifestPlaceholders = [appLinkHost: appLinkHost]
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // Compose
    implementation 'androidx.compose.material3:material3:1.3.2'
    implementation "com.google.accompanist:accompanist-systemuicontroller:0.36.0"

    implementation "com.google.dagger:hilt-android:2.57.1"
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.3'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation platform('androidx.compose:compose-bom:2025.08.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation "androidx.compose.ui:ui-android:1.9.0"
    implementation 'com.google.firebase:firebase-messaging-ktx:24.1.2'

    androidTestImplementation platform('androidx.compose:compose-bom:2025.08.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    kapt "com.google.dagger:hilt-compiler:2.57.1"
    implementation "androidx.hilt:hilt-navigation-compose:1.2.0"
    implementation "androidx.compose.runtime:runtime-livedata:1.9.0"

    implementation project(path: ':datepicker')
    implementation project(path: ':wheelview')

    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.9'

    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    // Firebase
    implementation(platform("com.google.firebase:firebase-bom:34.2.0"))
    implementation("com.google.firebase:firebase-analytics")
    implementation("com.google.firebase:firebase-auth")
    implementation("com.google.firebase:firebase-firestore")
    implementation("com.google.firebase:firebase-storage")
    implementation("com.google.firebase:firebase-database")
    implementation("com.google.firebase:firebase-functions")
    implementation 'com.google.firebase:firebase-analytics'

    // Navigation
    implementation("androidx.navigation:navigation-fragment-ktx:2.9.3")
    implementation("androidx.navigation:navigation-ui-ktx:2.9.3")

    // Images
    implementation 'io.coil-kt:coil:2.7.0'
    implementation 'io.coil-kt:coil-gif:2.7.0'
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    // Location
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Material
    implementation 'com.google.android.material:material:1.12.0'

    // Room
    implementation("androidx.room:room-runtime:2.7.2")
    kapt("androidx.room:room-compiler:2.7.2")
    implementation("androidx.room:room-ktx:2.7.2")
    //implementation "com.google.dagger:hilt-android:$hilt_version"
    //kapt "com.google.dagger:hilt-compiler:$hilt_version"

    // Gson
    implementation 'com.google.code.gson:gson:2.13.1'

    // Camera
    // The following line is optional, as the core library is included indirectly by camera-camera2
    implementation("androidx.camera:camera-core:1.4.2")
    implementation("androidx.camera:camera-camera2:1.4.2")
    // If you want to additionally use the CameraX Lifecycle library
    implementation("androidx.camera:camera-lifecycle:1.4.2")
    // If you want to additionally use the CameraX VideoCapture library
    implementation("androidx.camera:camera-video:1.4.2")
    // If you want to additionally use the CameraX View class
    implementation("androidx.camera:camera-view:1.4.2")
    // If you want to additionally add CameraX ML Kit Vision Integration
    //implementation("androidx.camera:camera-mlkit-vision:${camerax_version}")
    // If you want to additionally use the CameraX Extensions library
    implementation("androidx.camera:camera-extensions:1.4.2")
    implementation 'com.google.mlkit:vision-common:17.3.0'

    implementation 'com.google.zxing:core:3.5.3'
    //implementation "com.journeyapps:zxing-android-embedded:4.3.0"

    //implementation 'com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.0'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    // Splash
    implementation 'androidx.core:core-splashscreen:1.1.0-rc01'
}