// APK and environment configuration. Shared versions: gradle/libs.versions.toml.
// Decisions and validation: docs/runbooks/android-build-and-manifest.md.
import java.util.Properties

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.ksp)
    alias(libs.plugins.room)
    alias(libs.plugins.hilt.android)
    alias(libs.plugins.google.services)
    alias(libs.plugins.firebase.crashlytics)
}

// Room exports versioned schemas to app/schemas; preserve them when changing entities.
room {
    schemaDirectory("$projectDir/schemas")
}

// Local signing is optional during configuration; the prodRelease validation task requires it.
// Never commit signing properties or keystores. See docs/runbooks/android-release.md.
def localSigningFile = rootProject.file('signing.properties')
def localSigning = new Properties()
def localSigningReadFailed = false
if (localSigningFile.isFile()) {
    try {
        localSigningFile.withInputStream { localSigning.load(it) }
    } catch (IOException | IllegalArgumentException ignored) {
        localSigningReadFailed = true
    }
}
def missingSigningKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].findAll {
    !localSigning.getProperty(it)?.trim()
}
def localSigningConfigured = localSigningFile.isFile() &&
        !localSigningReadFailed && missingSigningKeys.isEmpty()

android {
    namespace = 'com.dynatech2012.kamleonuserapp'
    compileSdk = libs.versions.androidCompileSdk.get().toInteger()

    defaultConfig {
        applicationId = "com.dynatech2012.kamleonuserapp"
        minSdk = 30
        targetSdk = libs.versions.androidTargetSdk.get().toInteger()
        versionCode = 2028
        versionName = "1.0.15"

        resValue "string", "app_version", "${versionName}"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }
    }
    // Fixed baseline for existing debt: fix new issues instead of regenerating it to hide them.
    // Run lint separately from multivariant builds; see the CI recipe.
    lint {
        baseline = file("lint-baseline.xml")
        abortOnError = true
        warningsAsErrors = true
        checkDependencies = true
        checkTestSources = true
        // Legacy Log calls are migrated incrementally; keep all other Timber checks active.
        disable "LogNotTimber"
        // "A newer version is available" depends on the date, not on the code: with
        // warningsAsErrors it breaks builds on its own. Review versions on purpose instead.
        disable "AndroidGradlePluginVersion", "GradleDependency", "NewerVersionAvailable"
    }
    buildFeatures {
        viewBinding = true
        compose = true
        buildConfig = true
    }
    signingConfigs {
        if (localSigningConfigured) {
            upload {
                storeFile = file(localSigning.getProperty('storeFile'))
                storePassword = localSigning.getProperty('storePassword')
                keyAlias = localSigning.getProperty('keyAlias')
                keyPassword = localSigning.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        // R8 remains disabled: declaring ProGuard rules does not enable obfuscation/minification.
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    // All four environments share an applicationId (installing one replaces the others).
    // The app link host is injected into the manifest; also review each flavor's UrlConstants.
    flavorDimensions += "environment"
    productFlavors {
        internal{
            dimension = "environment"
            resValue "string", "app_name", "Kamleon-INT"
            versionNameSuffix = "-int"
            resValue "string", "app_version", "${defaultConfig.versionName}${versionNameSuffix}"
            def appLinkHost = "kamleon-v3-internal.vercel.app"
            manifestPlaceholders = [appLinkHost: appLinkHost]
        }
        development {
            dimension = "environment"
            resValue "string", "app_name", "Kamleon-DEV"
            versionNameSuffix = "-dev"
            resValue "string", "app_version", "${defaultConfig.versionName}${versionNameSuffix}"
            def appLinkHost = "dev.kamleon.app"
            manifestPlaceholders = [appLinkHost: appLinkHost]
        }
        prod {
            dimension = "environment"
            if (localSigningConfigured) {
                signingConfig = signingConfigs.upload
            }
            resValue "string", "app_name", "Kamleon"
            resValue "string", "app_version", "${defaultConfig.versionName}"
            def appLinkHost = "kamleon.app"
            manifestPlaceholders = [appLinkHost: appLinkHost]
        }
        preProduction {
            dimension = "environment"
            resValue "string", "app_name", "Kamleon-PRE"
            versionNameSuffix = "-pre"
            resValue "string", "app_version", "${defaultConfig.versionName}${versionNameSuffix}"
            def appLinkHost = "pre.kamleon.app"
            manifestPlaceholders = [appLinkHost: appLinkHost]
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

// Structural validation before prodRelease packaging, without printing sensitive values.
// This does not replace cryptographic certificate validation or AGP checks.
def validateProdReleaseSigning = tasks.register('validateProdReleaseSigning') {
    doLast {
        if (!localSigningFile.isFile()) {
            throw new GradleException('Create local signing.properties before building prodRelease. See docs/runbooks/android-release.md.')
        }
        if (localSigningReadFailed) {
            throw new GradleException('Cannot read signing.properties. Check its permissions and properties syntax.')
        }
        if (!missingSigningKeys.isEmpty()) {
            throw new GradleException("Missing signing.properties fields: ${missingSigningKeys.join(', ')}")
        }
        def uploadStoreFile = file(localSigning.getProperty('storeFile'))
        if (!uploadStoreFile.isFile() || !uploadStoreFile.canRead()) {
            throw new GradleException('The upload keystore must be an existing readable file. Check storeFile in signing.properties.')
        }
    }
}

tasks.matching {
    it.name in ['preProdReleaseBuild', 'validateSigningProdRelease', 'assembleProdRelease', 'bundleProdRelease']
}.configureEach {
    dependsOn validateProdReleaseSigning
}

