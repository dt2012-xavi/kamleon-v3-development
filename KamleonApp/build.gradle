// Registro común de plugins; cada módulo aplica solo los que necesita.
// Las versiones viven en gradle/libs.versions.toml. "apply false" evita
// aplicar plugins Android/Firebase al proyecto raíz, que no produce un APK.
// Repositorios y módulos: settings.gradle. Guía: docs/runbooks/android-build-and-manifest.md.
plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.android.library) apply false
    alias(libs.plugins.kotlin.android) apply false
    alias(libs.plugins.ksp) apply false
    alias(libs.plugins.room) apply false
    alias(libs.plugins.kotlin.compose) apply false
    alias(libs.plugins.hilt.android) apply false
    alias(libs.plugins.google.services) apply false
    alias(libs.plugins.firebase.crashlytics) apply false
}
