workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

stages:
  - verify

android_verify:
  stage: verify
  image: alvrme/alpine-android:android-36-jdk17-v2026.07.14
  interruptible: true
  timeout: 45m
  variables:
    GRADLE_USER_HOME: '$CI_PROJECT_DIR/.gradle-ci'
  cache:
    key:
      files:
        - KamleonApp/gradle/wrapper/gradle-wrapper.properties
        - KamleonApp/gradle/libs.versions.toml
    paths:
      - .gradle-ci/caches/modules-2/
      - .gradle-ci/wrapper/
  before_script:
    - cd KamleonApp
    - java -version
  script:
    - ./gradlew :app:assembleInternalDebug :app:assembleDevelopmentDebug :app:assemblePreProductionDebug :app:assembleProdDebug :app:testDevelopmentDebugUnitTest :app:lintDevelopmentDebug --no-daemon --console=plain
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - KamleonApp/app/build/reports/tests/testDevelopmentDebugUnitTest/
      - KamleonApp/app/build/reports/lint-results-developmentDebug.html
      - KamleonApp/app/build/test-results/testDevelopmentDebugUnitTest/
    reports:
      junit: KamleonApp/app/build/test-results/testDevelopmentDebugUnitTest/*.xml
